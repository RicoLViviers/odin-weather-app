<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="background-image"></div>
    <div id="content">
        <form action="" id="location-form">
            <input id="location-input" type="text" placeholder="location" required>
            <button type="submit">Submit</button>
        </form>
    
        <div id="data-container">
            <h2 class="data-header">Pretoria</h2>
            <div class="data-text">
                <p id="temp-text"></p>
                <p id="temp-max-text"></p>
                <p id="temp-min-text"></p>
                <p id="humidity-text"></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
